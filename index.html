<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expressions — Photo Archive</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="gallery">
    <section class="archive">
      <div id="photo-grid" class="photo-grid"></div>
    </section>

    <section class="viewer">
      <figure class="selected-photo">
        <img id="featured-image" src="images/photo-01.jpg" alt="Selected expression">
        <figcaption id="featured-caption">An expression, a moment, a memory.</figcaption>
      </figure>
    </section>
  </main>

  <script src="script.js"></script>
