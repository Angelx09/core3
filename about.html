<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>About the Book</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body class="about-body">


  <!-- ======================================
       VIDEO BACKGROUND
  ======================================= -->

  <video
    id="about-video"
    class="about-video"
    autoplay
    muted
    loop
    playsinline
  >

    <source
      src="images/about-background.mp4"
      type="video/mp4"
    >

  </video>



  <!-- ======================================
       SOUND BUTTON
  ======================================= -->

  <button
    id="sound-button"
    class="sound-button"
    type="button"
  >
    SOUND ON
  </button>



  <!-- ======================================
       BOOK
  ======================================= -->

  <main class="book-slideshow">


    <!-- BACK -->

    <a
      href="index.html"
      class="back-button"
    >
      ← BACK
    </a>



    <!-- BOOK IMAGE -->

    <div class="slideshow-container">

      <div class="slide-image-container">

        <img
          id="book-slide"
          src="images/book-01.jpeg"
          alt="Photograph of the physical book"
        >

      </div>

    </div>



    <!-- BOTTOM INFORMATION -->

    <div class="slide-info">

      <span id="slide-number">
        01 / 08
      </span>

      <span>
        MIDORI, 2026
      </span>

    </div>


  </main>



  <!-- ======================================
       JAVASCRIPT
  ======================================= -->

  <script>

    // ==========================================
    // BOOK IMAGES
    // ==========================================

    const bookImages = [
      "images/book-01.jpeg",
      "images/book-02.jpeg",
      "images/book-03.jpeg",
      "images/book-04.jpeg",
      "images/book-05.jpeg",
      "images/book-06.jpeg",
      "images/book-07.jpeg",
      "images/book-08.jpeg"
    ];



    // ==========================================
    // ELEMENTS
    // ==========================================

    const slideImage =
      document.getElementById("book-slide");

    const slideNumber =
      document.getElementById("slide-number");

    const video =
      document.getElementById("about-video");

    const soundButton =
      document.getElementById("sound-button");



    // ==========================================
    // CURRENT BOOK IMAGE
    // ==========================================

    let currentSlide = 0;



    // ==========================================
    // SHOW BOOK IMAGE
    // ==========================================

    function showSlide() {

      slideImage.src =
        bookImages[currentSlide];

      slideNumber.textContent =
        String(currentSlide + 1).padStart(2, "0")
        +
        " / "
        +
        String(bookImages.length).padStart(2, "0");

    }



    // ==========================================
    // CLICK IMAGE → NEXT IMAGE
    // ==========================================

    slideImage.addEventListener(
      "click",
      function () {

        currentSlide++;

        if (
          currentSlide >=
          bookImages.length
        ) {

          currentSlide = 0;

        }

        showSlide();

      }
    );



    // ==========================================
    // MAKE BOOK IMAGE CLICKABLE
    // ==========================================

    slideImage.style.cursor =
      "pointer";



    // ==========================================
    // SOUND ON / OFF
    // ==========================================

    soundButton.addEventListener(
      "click",
      function () {

        if (video.muted) {

          // TURN SOUND ON

          video.muted = false;

          video.volume = 1;

          video.play();

          soundButton.textContent =
            "SOUND OFF";

        } else {

          // TURN SOUND OFF

          video.muted = true;

          soundButton.textContent =
            "SOUND ON";

        }

      }
    );



    // ==========================================
    // START
    // ==========================================

    showSlide();


  </script>


</body>

</html>
